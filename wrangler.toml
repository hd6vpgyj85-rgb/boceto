# [MODIFICAR MANUAL] Nombre del Worker: debe coincidir con el nombre del
# proyecto que creaste en el dashboard de Cloudflare (Workers & Pages), o
# Workers Builds lo sobrescribe en cada deploy y abre un PR automático para
# "corregir" este archivo.
name = "websiteboceto"
compatibility_date = "2024-12-01"

# Genera dist/ automáticamente antes de "wrangler deploy". Esto hace el deploy
# robusto aunque el "Build command" del dashboard de Cloudflare esté vacío o
# no se haya configurado (causa típica del error "Could not detect a
# directory containing static files").
[build]
command = "npm install && npm run build"

# Despliegue como sitio estático (Workers Static Assets) para la SPA generada por Vite.
[assets]
directory = "./dist"
not_found_handling = "single-page-application"
